# /etc/nginx/sites-available/portfolio-api  (symlink into sites-enabled)
# Installed by hand, see api/README.md. Starts HTTP-only; run
#   certbot --nginx --redirect -d portfolio-api.builderization.com
# to add TLS (certbot rewrites this file: it adds the 443 server and an http->https redirect).
#
# Everything here is scoped to this one server_name. Do not add global directives (limit_req_status,
# server_tokens, ...) at http level: this file is included into the shared http {} block and would change
# the other sites on the machine.

# Defined at http level (sites-enabled files are included inside `http {}`); only the zone is global,
# and a zone only takes effect where a server/location opts in with limit_req.
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name portfolio-api.builderization.com;

    server_tokens off;

    # JSON endpoints never need more than the app's own 2 MB cap; only the image upload below is larger.
    # (nginx buffers request bodies to disk, so a big server-wide limit is a free disk-fill for anonymous callers.)
    client_max_body_size 2m;
    client_body_timeout 30s;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = / {
        return 302 https://ahmadbayrakdar.github.io/;
    }

    # Uploaded images: served straight from disk, never through Python.
    # Prefix location and alias both end in "/", so "/media../" style traversal cannot escape the directory.
    location /media/ {
        alias /var/lib/portfolio-api/media/;
        autoindex off;
        disable_symlinks on;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;  # ignored over plain HTTP
    }

    # Image upload (authenticated by the app): the only place a large body is accepted.
    location ~ ^/api/admin/projects/[0-9]+/media$ {
        client_max_body_size 17m;
        client_body_timeout 120s;
        limit_req zone=portfolio_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten (not appended) so a client-supplied X-Real-IP never reaches the app.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
